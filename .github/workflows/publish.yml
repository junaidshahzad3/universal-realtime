name: Publish to npm

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build bundle
        run: npm run build

      - name: Publish to npm
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view universal-realtime@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publish step gracefully."
          else
            echo "Version $CURRENT_VERSION is new. Publishing to npm registry..."
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
